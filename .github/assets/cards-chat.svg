<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="376" viewBox="0 0 1200 376" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".18"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
  .run { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -100; } }</style>
<g class="fx card" style="animation-delay:0s">
    <rect x="0.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="0.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:0s" x="0.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="22" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(33 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-10 8"/></g>
    <text x="86" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Фото + текст</text>
    <text x="24" y="102" font-size="15" fill="#b8a9d4">Несколько фото и подпись в одном</text>
    <text x="24" y="124" font-size="15" fill="#b8a9d4">сообщении — на FunPay так нельзя.</text></g>
<g class="fx card" style="animation-delay:0.1s">
    <rect x="408.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="408.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-1.3s" x="408.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="430" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(441 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><path d="M8.2 7.6L20 18"/><path d="M8.2 16.4L20 6"/></g>
    <text x="494" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Фоторедактор</text>
    <text x="432" y="102" font-size="15" fill="#b8a9d4">Обрезка, кисть и ластик прямо перед</text>
    <text x="432" y="124" font-size="15" fill="#b8a9d4">отправкой скриншота.</text></g>
<g class="fx card" style="animation-delay:0.2s">
    <rect x="816.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="816.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-2.6s" x="816.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="838" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(849 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></g>
    <text x="902" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Лайтбокс и альбомы</text>
    <text x="840" y="102" font-size="15" fill="#b8a9d4">Фото на весь экран с зумом, картинки</text>
    <text x="840" y="124" font-size="15" fill="#b8a9d4">складываются в мозаику.</text></g>
<g class="fx card" style="animation-delay:0.30000000000000004s">
    <rect x="0.5" y="200.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="0.5" y="200.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-3.9000000000000004s" x="0.5" y="200.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="22" y="222" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(33 233) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5l-4.8-4.8"/></g>
    <text x="86" y="253" font-size="19" font-weight="700" fill="#f3e8ff">Поиск по чату</text>
    <text x="24" y="302" font-size="15" fill="#b8a9d4">Ищите слова в переписке и прыгайте между</text>
    <text x="24" y="324" font-size="15" fill="#b8a9d4">совпадениями.</text></g>
<g class="fx card" style="animation-delay:0.4s">
    <rect x="408.5" y="200.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="408.5" y="200.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-5.2s" x="408.5" y="200.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="430" y="222" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(441 233) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 5h9"/><path d="M7.5 3v2"/><path d="M5 13c3-2 5-5 5.5-8"/><path d="M6.5 8.5c1.2 2 3 3.6 5 4.5"/><path d="M13 21l4-9 4 9"/><path d="M14.4 18h5.2"/></g>
    <text x="494" y="253" font-size="19" font-weight="700" fill="#f3e8ff">Автоперевод</text>
    <text x="432" y="302" font-size="15" fill="#b8a9d4">Входящие не на русском переводятся прямо</text>
    <text x="432" y="324" font-size="15" fill="#b8a9d4">под оригиналом.</text></g>
<g class="fx card" style="animation-delay:0.5s">
    <rect x="816.5" y="200.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="816.5" y="200.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-6.5s" x="816.5" y="200.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="838" y="222" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(849 233) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M10.5 15l3-6"/><path d="M6 10h.01M18 10h.01M6 14h.01M18 14h.01"/></g>
    <text x="902" y="253" font-size="19" font-weight="700" fill="#f3e8ff">Слеш-команды</text>
    <text x="840" y="302" font-size="15" fill="#b8a9d4">Наберите /команду — готовый текст</text>
    <text x="840" y="324" font-size="15" fill="#b8a9d4">вставится в поле.</text></g>
</svg>
