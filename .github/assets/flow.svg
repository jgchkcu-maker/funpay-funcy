  <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;.85;1" dur="7.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0" keyTimes="0;.9;1" dur="7.5s" repeatCount="indefinite"/></path>
