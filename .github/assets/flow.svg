    <circle cx="370" cy="150" r="44" fill="url(#panel)" stroke="url(#brand)" stroke-width="2"/>
    <g transform="translate(351 131) scale(1.5833333333333333)" stroke="#f5d0fe" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5"/><path d="M12 12v9"/></g>
