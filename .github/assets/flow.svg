<circle r="7" fill="#fff" filter="url(#glow)">
  <animateMotion path="M140 150 L1060 150" dur="7.5s" keyPoints="0;1;1" keyTimes="0;.85;1" calcMode="linear" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0" keyTimes="0;.9;1" dur="7.5s" repeatCount="indefinite"/></circle>
