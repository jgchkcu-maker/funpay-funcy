<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }</style>

<rect x=".5" y=".5" width="1199" height="299" rx="28" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".35"/>
<text x="600" y="46" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4" fill="#a78bfa">ПОКА ВЫ СПИТЕ</text>
<path d="M140 150 L1060 150" stroke="#a855f7" stroke-opacity=".25" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
