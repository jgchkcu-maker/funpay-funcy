<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="301" height="64" viewBox="0 0 301 64" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="bc"><rect x="4" y="4" width="293" height="56" rx="28"/></clipPath></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sh { animation: sh 3s ease-in-out infinite; }
  @keyframes sh { 0% { transform: translateX(-120px); } 60%,100% { transform: translateX(421px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .8; } }</style>

<rect class="pulse" x="4" y="4" width="293" height="56" rx="28" fill="url(#brand)" filter="url(#glow)"/>
<rect x="4" y="4" width="293" height="56" rx="28" fill="url(#brand)" stroke="#f5d0fe" stroke-opacity=".5"/>
<g clip-path="url(#bc)"><rect class="sh" x="0" y="0" width="80" height="64" fill="url(#sw)" transform="skewX(-20)"/></g>
<text x="150.5" y="38.5" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Установить в Chrome</text>
</svg>
