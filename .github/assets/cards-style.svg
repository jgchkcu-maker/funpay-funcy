<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="376" viewBox="0 0 1200 376" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".18"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
  .run { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -100; } }</style>
<g class="fx card" style="animation-delay:0s">
