    <rect class="run" style="animation-delay:0s" x="0.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="22" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
