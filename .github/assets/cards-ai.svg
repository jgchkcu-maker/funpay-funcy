<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="376" viewBox="0 0 1200 376" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".18"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
  .run { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -100; } }</style>
<g class="fx card" style="animation-delay:0s">
    <rect x="0.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="0.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:0s" x="0.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="22" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(33 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></g>
    <text x="86" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Ассистент в чате</text>
    <text x="24" y="102" font-size="15" fill="#b8a9d4">«ку ща выдам» превращается в</text>
    <text x="24" y="124" font-size="15" fill="#b8a9d4">«Здравствуйте! Сейчас выдам товар, одну</text>
    <text x="24" y="146" font-size="15" fill="#b8a9d4">минуту.»</text></g>
<g class="fx card" style="animation-delay:0.1s">
    <rect x="408.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="408.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-1.3s" x="408.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="430" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(441 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/></g>
    <text x="494" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Генератор лотов</text>
    <text x="432" y="102" font-size="15" fill="#b8a9d4">Названия и описания в вашем стиле —</text>
    <text x="432" y="124" font-size="15" fill="#b8a9d4">достаточно описать идею.</text></g>
<g class="fx card" style="animation-delay:0.2s">
    <rect x="816.5" y="0.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="816.5" y="0.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-2.6s" x="816.5" y="0.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="838" y="22" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(849 33) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></g>
    <text x="902" y="53" font-size="19" font-weight="700" fill="#f3e8ff">Ответ на отзывы</text>
    <text x="840" y="102" font-size="15" fill="#b8a9d4">Уместный ответ одним кликом с</text>
    <text x="840" y="124" font-size="15" fill="#b8a9d4">упоминанием купленного товара.</text></g>
<g class="fx card" style="animation-delay:0.30000000000000004s">
    <rect x="204.5" y="200.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="204.5" y="200.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-3.9000000000000004s" x="204.5" y="200.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="226" y="222" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(237 233) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></g>
    <text x="290" y="253" font-size="19" font-weight="700" fill="#f3e8ff">Переводчик</text>
    <text x="228" y="302" font-size="15" fill="#b8a9d4">Названия, описания и сообщения</text>
    <text x="228" y="324" font-size="15" fill="#b8a9d4">покупателю на любом языке.</text></g>
<g class="fx card" style="animation-delay:0.4s">
    <rect x="612.5" y="200.5" width="383" height="175" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".28"/>
    <rect x="612.5" y="200.5" width="383" height="175" rx="22" fill="url(#corner)"/>
    <rect class="run" style="animation-delay:-5.2s" x="612.5" y="200.5" width="383" height="175" rx="22" stroke="url(#brand)" stroke-width="1.6" pathLength="100" stroke-dasharray="12 88"/>
    <rect x="634" y="222" width="48" height="48" rx="14" fill="url(#brand)" opacity=".2"/>
    <g transform="translate(645 233) scale(1.0833333333333333)" stroke="#f5d0fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-10 8"/></g>
    <text x="698" y="253" font-size="19" font-weight="700" fill="#f3e8ff">Генератор превью</text>
    <text x="636" y="302" font-size="15" fill="#b8a9d4">Обложки для лотов по описанию: иконка,</text>
    <text x="636" y="324" font-size="15" fill="#b8a9d4">фон и стиль подбираются сами.</text></g>
</svg>
