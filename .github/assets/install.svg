<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="210" viewBox="0 0 1200 210" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }.st { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }</style>

<rect x=".5" y=".5" width="1199" height="209" rx="28" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".35"/>
<path d="M200 82H1000" stroke="#a855f7" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 8">
  <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></path>
<g class="fx st" style="animation-delay:0s">
  <circle cx="200" cy="82" r="34" fill="#0a0612" stroke="url(#brand)" stroke-width="2.5"/>
  <circle cx="200" cy="82" r="34" stroke="#e879f9" stroke-width="2" opacity="0">
    <animate attributeName="r" values="34;50" dur="3s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
  <text x="200" y="94" text-anchor="middle" font-size="32" font-weight="800" fill="url(#brand)">1</text>
  <text x="200" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#f3e8ff">Открыть</text>
  <text x="200" y="178" text-anchor="middle" font-size="15" fill="#a78bfa">страницу в Chrome Web Store</text></g>
<g class="fx st" style="animation-delay:0.2s">
  <circle cx="600" cy="82" r="34" fill="#0a0612" stroke="url(#brand)" stroke-width="2.5"/>
  <circle cx="600" cy="82" r="34" stroke="#e879f9" stroke-width="2" opacity="0">
    <animate attributeName="r" values="34;50" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  <text x="600" y="94" text-anchor="middle" font-size="32" font-weight="800" fill="url(#brand)">2</text>
  <text x="600" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#f3e8ff">Установить</text>
  <text x="600" y="178" text-anchor="middle" font-size="15" fill="#a78bfa">одна кнопка, без регистрации</text></g>
<g class="fx st" style="animation-delay:0.4s">
  <circle cx="1000" cy="82" r="34" fill="#0a0612" stroke="url(#brand)" stroke-width="2.5"/>
  <circle cx="1000" cy="82" r="34" stroke="#e879f9" stroke-width="2" opacity="0">
    <animate attributeName="r" values="34;50" dur="3s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".8;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  <text x="1000" y="94" text-anchor="middle" font-size="32" font-weight="800" fill="url(#brand)">3</text>
  <text x="1000" y="152" text-anchor="middle" font-size="21" font-weight="700" fill="#f3e8ff">Зайти на FunPay</text>
  <text x="1000" y="178" text-anchor="middle" font-size="15" fill="#a78bfa">кнопка Funcy появится в шапке</text></g>
</svg>
