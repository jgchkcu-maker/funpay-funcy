<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="120" viewBox="0 0 1200 120" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="barclip"><rect x="0" y="104" width="1200" height="4" rx="2"/></clipPath></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .ic { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
  .tt { animation: up .8s .12s cubic-bezier(.2,.8,.2,1) both; }
  .bar { animation: bar 1.2s .3s cubic-bezier(.2,.8,.2,1) both; transform-origin: left; transform-box: fill-box; }
  @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .sweep { animation: sweep 3.5s 1.5s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1100px); } }</style>

<g class="fx ic">
  <rect x="2" y="14" width="76" height="76" rx="22" fill="url(#brand)" opacity=".18"/>
  <rect x="2.5" y="14.5" width="75" height="75" rx="21.5" stroke="url(#brand)" stroke-opacity=".7"/>
  <g transform="translate(21 33) scale(1.5833333333333333)" stroke="#f5d0fe" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></g>
</g>
<g class="fx tt">
  <text x="102" y="56" font-size="40" font-weight="800" letter-spacing="-.5" fill="url(#brand)">Установка</text>
  <text x="104" y="86" font-size="18" font-weight="500" fill="#8b7aa8">Меньше минуты</text>
</g>
<g clip-path="url(#barclip)">
  <rect class="bar" x="0" y="104" width="1200" height="4" rx="2" fill="url(#brand)" opacity=".55"/>
  <rect class="sweep" x="-100" y="104" width="100" height="4" fill="url(#sw)"/>
</g>
</svg>
