<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="150" viewBox="0 0 1200 150" fill="none">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#140a24"/><stop offset="1" stop-color="#0a0612"/>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
  text { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .fx { transform-box: fill-box; transform-origin: center; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { animation: up .8s cubic-bezier(.2,.8,.2,1) both; }
  .run { animation: run 4.4s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -100; } }</style>
<g class="fx card" style="animation-delay:0s">
    <rect x="1" y="1" width="280" height="148" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".25"/>
    <rect class="run" style="animation-delay:0s" x="1" y="1" width="280" height="148" rx="22" stroke="url(#brand)" stroke-width="2" pathLength="100" stroke-dasharray="18 82"/>
    <text x="141" y="78" text-anchor="middle" font-size="50" font-weight="800" fill="url(#brand)" letter-spacing="-1">299+</text>
    <text x="141" y="112" text-anchor="middle" font-size="17" font-weight="500" fill="#c4b5fd">инструментов</text></g><g class="fx card" style="animation-delay:0.15s">
    <rect x="307" y="1" width="280" height="148" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".25"/>
    <rect class="run" style="animation-delay:-1.1s" x="307" y="1" width="280" height="148" rx="22" stroke="url(#brand)" stroke-width="2" pathLength="100" stroke-dasharray="18 82"/>
    <text x="447" y="78" text-anchor="middle" font-size="50" font-weight="800" fill="url(#brand)" letter-spacing="-1">360+</text>
    <text x="447" y="112" text-anchor="middle" font-size="17" font-weight="500" fill="#c4b5fd">автотестов</text></g><g class="fx card" style="animation-delay:0.3s">
    <rect x="613" y="1" width="280" height="148" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".25"/>
    <rect class="run" style="animation-delay:-2.2s" x="613" y="1" width="280" height="148" rx="22" stroke="url(#brand)" stroke-width="2" pathLength="100" stroke-dasharray="18 82"/>
    <text x="753" y="78" text-anchor="middle" font-size="50" font-weight="800" fill="url(#brand)" letter-spacing="-1">0</text>
    <text x="753" y="112" text-anchor="middle" font-size="17" font-weight="500" fill="#c4b5fd">зависимостей и сборки</text></g><g class="fx card" style="animation-delay:0.44999999999999996s">
    <rect x="919" y="1" width="280" height="148" rx="22" fill="url(#panel)" stroke="#a855f7" stroke-opacity=".25"/>
    <rect class="run" style="animation-delay:-3.3000000000000003s" x="919" y="1" width="280" height="148" rx="22" stroke="url(#brand)" stroke-width="2" pathLength="100" stroke-dasharray="18 82"/>
    <text x="1059" y="78" text-anchor="middle" font-size="50" font-weight="800" fill="url(#brand)" letter-spacing="-1">MV3</text>
    <text x="1059" y="112" text-anchor="middle" font-size="17" font-weight="500" fill="#c4b5fd">Manifest V3</text></g>
</svg>
