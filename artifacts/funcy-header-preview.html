<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funcy — кнопка открытия</title><link rel="stylesheet" href="/css/content_styles.css"><style>
body{margin:0;padding:32px;background:#f8f9ff;font-family:'Segoe UI',sans-serif;color:#929aaa}main{max-width:834px;margin:auto}.states{display:flex;justify-content:space-around;gap:24px;padding:16px 0 32px}.sample{text-align:center}.sample p{margin:0 0 12px;font-weight:600}.sample .frame{display:flex;align-items:center;justify-content:center;width:252px;height:90px}.sample #fpToolsButton{margin:0;zoom:2.25}.dark #fpToolsButton{color:#b8a8ff!important}small{display:block;margin:12px 0}header{background:white;padding:0 16px;border:1px solid #e7e7ef;border-radius:12px}.nav{display:flex;align-items:center;justify-content:flex-end;list-style:none;margin:0;padding:0;min-height:50px}.nav>li>a:not(#fpToolsButton){display:block;padding:20px 12px;font-size:14px;color:#646879}.dark{margin-top:20px;background:#191a24}.dark .nav>li>a:not(#fpToolsButton){color:#d1d4df}h2{font-size:14px;font-weight:500}#notice{min-height:20px;font-size:14px;color:#4e32ad}@media(max-width:650px){body{padding:16px}.states{flex-direction:column;align-items:center}.nav>li>a:not(#fpToolsButton){padding:15px 4px}.nav #fpToolsButton{margin-inline:4px}}
</style></head><body><main><h2>В шапке страницы</h2><header><ul class="nav navbar-nav navbar-right logged"><li><a>Профиль</a></li><li><a id="fpToolsButton" role="button" tabindex="0" aria-label="Открыть FunPay Funcy"><img src="/icons/icon48.png" alt="" width="22" height="22">Funcy</a></li><li><a>Сообщения</a></li></ul></header><header class="dark"><ul class="nav"><li><a>Профиль</a></li><li><a id="fpToolsButton" role="button" tabindex="0" aria-label="Открыть FunPay Funcy"><img src="/icons/icon48.png" alt="" width="22" height="22">Funcy</a></li><li><a>Сообщения</a></li></ul></header><p id="notice"></p></main><script>document.querySelectorAll('#fpToolsButton').forEach(button=>{button.onclick=()=>document.querySelector('#notice').textContent='Funcy';button.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();button.click()}}});</script></body></html>
